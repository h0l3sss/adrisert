<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teste de deploy</title>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f4f6f8; color: #101c26; }
  main { max-width: 560px; margin: 0 auto; }
  code { font-size: 1.4rem; font-weight: 700; }
  button { font: inherit; padding: 10px 14px; border: 0; border-radius: 6px; background: #1f5f8b; color: #fff; cursor: pointer; }
  #resultado { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Teste de deploy</h1>
  <p>Código aleatório desta versão: <code id="codigo"></code></p>
  <p><button id="testar" type="button">Testar /api/hit</button></p>
  <p id="resultado" role="status"></p>
</main>
<script>
  (function () {
    var codigo = Math.random().toString(36).slice(2, 8).toUpperCase();
    document.getElementById('codigo').textContent = codigo;

    document.getElementById('testar').addEventListener('click', function () {
      var resultado = document.getElementById('resultado');
      resultado.textContent = 'Enviando...';
      fetch('/api/hit', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ caminho: '/teste-deploy' }),
      })
        .then(function (resposta) {
          resultado.textContent = 'Resposta de /api/hit: ' + resposta.status;
        })
        .catch(function (erro) {
          resultado.textContent = 'Falha de rede: ' + erro.message;
        });
    });
  })();
</script>
</body>
</html>
